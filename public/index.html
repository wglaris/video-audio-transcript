<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Audio Transcript Tool</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <div class="source-panel">
          <div class="title-row">
            <h1>Video Audio Transcript Tool</h1>
            <div id="status" class="status"></div>
          </div>

          <label class="field">
            <span>Video URL</span>
            <div class="input-row">
              <input id="urlInput" type="url" placeholder="Paste a Bilibili, YouTube, Xiaohongshu, Douyin/TikTok, or other supported video URL" autocomplete="off">
            </div>
            <div class="source-actions">
              <button id="loadUrl">Load</button>
              <button id="loadAudio">Audio Only</button>
              <button id="transcribeUrl">Generate Transcript</button>
            </div>
          </label>

          <div class="divider"><span>or</span></div>

          <label class="file-picker">
            <input id="fileInput" type="file" accept="video/*,audio/*">
            <span>Choose a local media file</span>
          </label>

          <div id="message" class="message"></div>
        </div>

        <div class="video-panel">
          <video id="video" controls playsinline></video>
          <aside class="transcript-panel" aria-label="Video transcript">
            <div class="transcript-title">
              <span>Transcript</span>
              <div class="transcript-actions">
                <button id="showFullTranscript" type="button">Show Full Transcript</button>
                <button id="followCurrent" type="button">Follow Playback</button>
              </div>
            </div>
            <div id="currentLine" class="current-line">The current sentence will appear here after transcription.</div>
            <div id="transcriptList" class="transcript-list"></div>
          </aside>
        </div>

        <div class="controls-panel">
          <div class="time-grid">
            <label>
              <span>Start</span>
              <input id="startInput" type="text" inputmode="numeric" placeholder="00:00" value="00:00">
            </label>
            <label>
              <span>End</span>
              <input id="endInput" type="text" inputmode="numeric" placeholder="00:00" value="00:00">
            </label>
            <button id="markStart" title="Use the current playback position as the start time">Set Start</button>
            <button id="markEnd" title="Use the current playback position as the end time">Set End</button>
          </div>

          <div class="range-wrap">
            <input id="startRange" type="range" min="0" max="100" step="0.1" value="0">
            <input id="endRange" type="range" min="0" max="100" step="0.1" value="0">
          </div>

          <label class="filename-field">
            <span>Export Filename</span>
            <input id="filenameInput" type="text" placeholder="Example: interview-highlight-1">
          </label>

          <div class="export-row">
            <div class="segmented" role="group" aria-label="Export type">
              <button class="active" data-type="audio">Audio</button>
              <button data-type="video">Video</button>
            </div>

            <select id="formatSelect" aria-label="Audio format">
              <option value="mp3">MP3</option>
              <option value="m4a">M4A</option>
              <option value="wav">WAV</option>
            </select>

            <button id="transcribeBtn">Transcribe</button>
            <button id="exportBtn" class="primary">Export</button>
          </div>

          <div id="result" class="result"></div>
        </div>
      </section>
    </main>
    <dialog id="fullTranscriptDialog" class="full-transcript-dialog">
      <form method="dialog" class="dialog-panel">
        <div class="dialog-title">
          <h2>Full Transcript</h2>
          <button id="closeFullTranscript" type="submit" aria-label="Close">Close</button>
        </div>
        <textarea id="fullTranscriptText" readonly></textarea>
        <div class="dialog-actions">
          <button id="copyFullTranscript" type="button">Copy All</button>
        </div>
      </form>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
